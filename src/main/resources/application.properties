spring.datasource.url=jdbc:postgresql://ep-tiny-heart-ad1p5ck5-pooler.c-2.us-east-1.aws.neon.tech/zygodb?sslmode=require&channelBinding=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

# redis-connection
spring.data.redis.host=redis-19188.c244.us-east-1-2.ec2.cloud.redislabs.com
spring.data.redis.port=19188
spring.data.redis.username=default
spring.data.redis.password=${CACHE_PASSWORD}
spring.data.redis.ssl.enabled=false
spring.data.redis.timeout=120000

# auth
jwt.secret=${JWT_SECRET}
jwt.token.expires-length=3600000

# mapbox
mapbox.access.token=${MAPBOX-ACCESS-TOKEN}
mapbox.base-url=https://api.mapbox.com/directions/v5/

# firebase
firebase.config.path=${FIREBASE_CONFIG_PATH}

# rabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5676
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# retry for consumer (Spring)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=3s
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.max-interval=30s
spring.rabbitmq.listener.simple.retry.multiplier=2.0
# retry for publisher (rabbitmq)
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=3s
spring.rabbitmq.template.retry.max-attempts=5
spring.rabbitmq.template.retry.max-interval=30s
spring.rabbitmq.template.retry.multiplier=2.0

# expirou max-attempts lança para a dead letter exchange
spring.rabbitmq.listener.simple.default-requeue.reject=false

# desativa de forma temporária os listeners na fase de dev
spring.rabbitmq.listener.type=simple
spring.rabbitmq.listener.simple.auto-startup=false

# circuit breaker (resilience4j)
resilience4j.circuitbreaker.instances.gpsIngestor.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.gpsIngestor.sliding-window-size=10
resilience4j.circuitbreaker.instances.gpsIngestor.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gpsIngestor.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.gpsIngestor.permitted-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.gpsIngestor.minimum-number-of-calls=5

# Storage configurations (SDK S3 AWS)
storage.access-key=abcd
storage.secret-key=abcd2345
storage.bucket-name=zygo-profile-pictures
storage.endpoint=http://localhost:9000
storage.region=us-east-1
storage.public-base-url=http://localhost:9000/zygo-profile-pictures

#profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# LOGS and others
spring.flyway.enabled=false

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.transaction=DEBUG

logging.level.org.springframework.amqp=DEBUG
logging.level.com.rabbitmq=DEBUG

logging.level.org.hibernate.SQL=DEBUG